<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ULTRON — System HUD</title>
<style>
  :root{
    --bg:#050608; --cyan:#4fe0ff; --amber:#ffb454; --red:#ff4f5e;
    --dim:#5a6b7a; --panel:rgba(15,25,32,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);
    font-family:'Courier New',monospace;color:var(--cyan);overflow:hidden;}
  #grid{
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(79,224,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,224,255,.06) 1px, transparent 1px);
    background-size:40px 40px;
  }
  #wrap{position:relative;z-index:1;height:100%;display:grid;
    grid-template-columns:1fr 1.2fr 1fr;grid-template-rows:auto 1fr;gap:16px;padding:24px;}
  header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid rgba(79,224,255,.3);padding-bottom:10px;}
  h1{margin:0;letter-spacing:.4em;font-size:22px;font-weight:normal;}
  #status-pill{font-size:12px;letter-spacing:.2em;padding:4px 12px;border:1px solid var(--dim);border-radius:20px;color:var(--dim);}
  #status-pill.listening{color:var(--cyan);border-color:var(--cyan);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}

  .panel{background:var(--panel);border:1px solid rgba(79,224,255,.2);
    border-radius:4px;padding:16px;overflow-y:auto;}
  .panel h2{margin:0 0 12px;font-size:12px;letter-spacing:.3em;color:var(--dim);font-weight:normal;}

  #devices .device{display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;border-bottom:1px solid rgba(79,224,255,.08);font-size:13px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:8px;}
  .dot.online{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
  .dot.offline{background:var(--red);}

  #core{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  #ring{width:180px;height:180px;border-radius:50%;border:2px solid rgba(79,224,255,.3);
    display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:20px;}
  #ring::before{content:'';position:absolute;inset:-10px;border-radius:50%;
    border:1px dashed rgba(79,224,255,.2);animation:spin 12s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #ring-label{font-size:11px;letter-spacing:.3em;color:var(--dim);}
  #transcript{font-size:14px;color:#dff8ff;min-height:40px;padding:0 10px;}
  #intent-tag{margin-top:10px;font-size:12px;color:var(--amber);letter-spacing:.15em;min-height:18px;}

  #log{font-size:12px;line-height:1.7;color:var(--dim);}
  #log .entry{margin-bottom:4px;}
  #log .entry .t{color:var(--cyan);}
  #log .entry .err{color:var(--red);}
</style>
</head>
<body>
<div id="grid"></div>
<div id="wrap">
  <header>
    <h1>N E X O R A &nbsp;// &nbsp;U L T R O N &nbsp;C O R E</h1>
    <div id="status-pill">STANDBY</div>
  </header>

  <div class="panel" id="devices">
    <h2>CONNECTED DEVICES</h2>
    <div id="device-list"></div>
  </div>

  <div class="panel" id="core">
    <div id="ring"><div id="ring-label">IDLE</div></div>
    <div id="transcript">Awaiting voice command…</div>
    <div id="intent-tag"></div>
  </div>

  <div class="panel">
    <h2>SYSTEM LOG</h2>
    <div id="log"></div>
  </div>
</div>

<script>
const WS_URL = "ws://localhost:8765";
let ws;

function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => setPill("ONLINE", true);
  ws.onclose = () => { setPill("DISCONNECTED", false); setTimeout(connect, 2000); };
  ws.onmessage = (e) => handleEvent(JSON.parse(e.data));
}
connect();

function setPill(text, listening){
  const pill = document.getElementById('status-pill');
  pill.textContent = text;
  pill.classList.toggle('listening', !!listening);
}

function log(msg, isErr){
  const el = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'entry';
  const time = new Date().toLocaleTimeString();
  entry.innerHTML = `<span class="t">[${time}]</span> <span class="${isErr?'err':''}">${msg}</span>`;
  el.prepend(entry);
  while(el.children.length > 40) el.removeChild(el.lastChild);
}

function handleEvent(evt){
  if(evt.type === 'system_state'){
    document.getElementById('ring-label').textContent = evt.state;
    document.getElementById('transcript').textContent = evt.message;
    log(evt.message);
  }
  else if(evt.type === 'transcript'){
    document.getElementById('transcript').textContent = evt.text;
    document.getElementById('ring-label').textContent = 'PARSING';
    log(`heard: "${evt.text}"`);
  }
  else if(evt.type === 'intent'){
    const a = evt.intent.action || 'unknown';
    document.getElementById('intent-tag').textContent = `→ ${a.toUpperCase()}`;
    document.getElementById('ring-label').textContent = 'DISPATCHING';
    log(`intent resolved: ${a}`);
  }
  else if(evt.type === 'dispatching'){
    document.getElementById('ring-label').textContent = 'EXECUTING';
  }
  else if(evt.type === 'result'){
    document.getElementById('ring-label').textContent = 'IDLE';
    const hasError = JSON.stringify(evt.result).includes('"error"');
    log(`${evt.action} → ${hasError ? 'error' : 'done'}`, hasError);
  }
  else if(evt.type === 'device_status'){
    renderDevices(evt.status);
  }
}

function renderDevices(status){
  const list = document.getElementById('device-list');
  list.innerHTML = '';
  Object.entries(status).forEach(([name, online]) => {
    const row = document.createElement('div');
    row.className = 'device';
    row.innerHTML = `<span><span class="dot ${online?'online':'offline'}"></span>${name}</span>
                      <span>${online ? 'ONLINE' : 'OFFLINE'}</span>`;
    list.appendChild(row);
  });
}
</script>
</body>
</html>
